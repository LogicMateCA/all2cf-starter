services:
  starter-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - starter-node-modules:/workspace/node_modules
      - /opt/1panel/apps/_starter_profile:/opt/1panel/apps/_starter_profile:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh/id_1panel_root_192_168_0_91:/run/starter-secrets/production-ssh-key:ro
      - /root/.ssh/known_hosts:/run/starter-secrets/known_hosts:ro
    ports:
      - "15173:5173"
      - "18787:8787"
    command: ["sleep", "infinity"]

  browser-acceptance:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["qa"]
    network_mode: "service:starter-dev"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - starter-node-modules:/workspace/node_modules
    environment:
      STARTER_BROWSER_BASE_URL: http://127.0.0.1:8787
      STARTER_BROWSER_EXECUTABLE_PATH: /ms-playwright/chromium-1234/chrome-linux64/chrome
    command: ["sleep", "infinity"]

volumes:
  starter-node-modules:
