name: Public Starter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:sites
      - run: npm run bundle:check:marketing
      - run: npm run bundle:check:web
      - run: npm run bundle:check:docs
      - name: Verify public release receipt
        run: node -e 'const r=require("./.starter/public-release.json"); if(r.schemaVersion!=="all2cf-public-source/v1"||r.optionalPackCount!==0) process.exit(1)'
