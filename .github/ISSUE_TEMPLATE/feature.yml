name: Feature request
description: Propose a product improvement or new capability
title: "[Feature] "
labels:
  - "type: feature"
  - "status: triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than a required implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional existing workarounds or trade-offs.

