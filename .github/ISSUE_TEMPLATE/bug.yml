name: Bug report
description: Report reproducible product behavior that appears incorrect
title: "[Bug] "
labels:
  - "type: bug"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private logs, customer data, or personal information. Use All2CF Support for private or account-specific problems.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Product version
      placeholder: "For example: 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - All2CF Console
        - Manual deployment
        - Deploy to Cloudflare
        - Documentation only
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, customer data, private URLs, and personal information.
          required: true

